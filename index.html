<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>模型评估可用率计算器</title>
  <style>
    :root {
      --bg: #f6f4f1;
      --surface: #ffffff;
      --surface-soft: #f4f1ed;
      --surface-warm: #eee8df;
      --primary: #f25a1d;
      --primary-dark: #d9440d;
      --ink: #1d2029;
      --text: #1d2029;
      --muted: #85817b;
      --placeholder: #b7b0a8;
      --border: #e2ddd6;
      --success: #39b86a;
      --warning: #e8a11d;
      --danger: #e05243;
      --purple: #6977ec;
      --shadow: 0 20px 60px rgba(53, 45, 39, 0.12);
      --soft-shadow: 0 12px 28px rgba(61, 52, 45, 0.08);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      color: var(--text);
      background: var(--bg);
      font-family: Inter, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      line-height: 1.5;
    }

    button, input, select, textarea { font: inherit; }

    button {
      cursor: pointer;
      border: 0;
      transition: background-color 150ms ease-out, border-color 150ms ease-out, color 150ms ease-out;
    }

    button:disabled { cursor: not-allowed; opacity: .58; }

    .page {
      width: 100%;
      min-height: 100vh;
      margin: 0;
      padding: 0;
      display: grid;
      grid-template-columns: 190px minmax(0, 1fr);
      background: var(--bg);
    }

    .hero {
      padding: 34px 40px 24px;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 10px;
      border-radius: 8px;
      color: var(--primary);
      background: rgba(242, 90, 29, .1);
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 12px;
    }

    h1 {
      margin: 0;
      font-size: 34px;
      line-height: 1.18;
      letter-spacing: 0;
    }

    .subtitle {
      max-width: 760px;
      margin: 10px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    .hero-actions {
      display: flex;
      gap: 10px;
      align-items: center;
      justify-content: flex-end;
      flex-wrap: wrap;
    }

    .page-nav {
      grid-row: 1 / span 3;
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 34px 20px;
      border-right: 1px solid var(--border);
      background: #f1eee9;
    }

    .page-tab {
      min-height: 48px;
      border: 0;
      border-radius: 14px;
      padding: 0 14px;
      color: var(--muted);
      background: transparent;
      font-size: 15px;
      font-weight: 800;
      justify-content: flex-start;
      letter-spacing: 0;
    }

    .page-tab.active {
      color: #fff;
      background: var(--ink);
      box-shadow: 0 10px 22px rgba(29,32,41,.16);
    }

    .page-panel[hidden] {
      display: none;
    }

    .table-actions {
      display: flex;
      gap: 10px;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
    }

    .module-toolbar {
      display: flex;
      gap: 10px;
      align-items: center;
      justify-content: flex-end;
      flex-wrap: wrap;
    }

    .grid {
      display: grid;
      grid-template-columns: 360px minmax(0, 1fr);
      gap: 18px;
      align-items: start;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      box-shadow: var(--soft-shadow);
      overflow: hidden;
    }

    .card-header {
      padding: 20px 22px 14px;
      border-bottom: 1px solid var(--border);
      background: #fff;
    }

    .card-title {
      margin: 0;
      font-size: 16px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .card-title::before {
      content: "";
      display: inline-block;
      width: 4px;
      height: 16px;
      border-radius: 999px;
      background: var(--primary);
    }

    .card-desc {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    .card-body { padding: 22px; }

    .stack { display: grid; gap: 14px; }
    .stack-sm { display: grid; gap: 10px; }

    label {
      display: block;
      color: var(--text);
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
    }

    input[type="text"], input[type="url"], input[type="date"], select, textarea {
      width: 100%;
      min-height: 40px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: #fff;
      color: var(--text);
      padding: 9px 11px;
      outline: none;
      transition: border-color 150ms ease-out, box-shadow 150ms ease-out;
    }

    textarea {
      min-height: 92px;
      resize: vertical;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      font-size: 13px;
      line-height: 1.6;
      white-space: pre;
    }

    input:focus, select:focus, textarea:focus {
      border-color: rgba(242, 90, 29, .55);
      box-shadow: 0 0 0 3px rgba(242, 90, 29, .1);
    }

    .upload-box {
      border: 1px dashed rgba(242, 90, 29, .38);
      background: rgba(242, 90, 29, .05);
      border-radius: 18px;
      padding: 16px;
    }

    .file-row {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }

    .file-input { display: none; }

    .btn {
      min-height: 40px;
      border-radius: 12px;
      padding: 0 14px;
      font-size: 14px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
    }

    .btn-primary { color: #fff; background: var(--ink); }
    .btn-primary:hover { background: var(--primary-dark); }
    .btn-soft { color: var(--primary-dark); background: rgba(242, 90, 29, .1); }
    .btn-soft:hover { background: rgba(242, 90, 29, .16); }
    .btn-ghost { color: var(--muted); background: var(--surface-soft); }
    .btn-ghost:hover { color: var(--text); background: #ebe5dc; }
    .btn-danger { color: #b42318; background: rgba(255, 126, 115, .14); }
    .btn-danger:hover { background: rgba(255, 126, 115, .22); }

    .hint {
      color: var(--muted);
      font-size: 12px;
    }

    .status {
      border-radius: 14px;
      padding: 10px 12px;
      font-size: 13px;
      font-weight: 500;
      display: none;
    }

    .status.show { display: block; }
    .status.info { color: var(--primary-dark); background: rgba(242,90,29,.09); }
    .status.success { color: #198c38; background: rgba(74,212,108,.12); }
    .status.warn { color: #956000; background: rgba(255,170,51,.15); }
    .status.error { color: #b42318; background: rgba(255,126,115,.15); }

    .tabs {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .tab {
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--muted);
      border-radius: 12px;
      padding: 7px 10px;
      font-size: 13px;
      font-weight: 600;
    }

    .tab.active {
      border-color: rgba(51,119,255,.45);
      color: var(--primary);
      background: rgba(242,90,29,.1);
    }

    .main-col { display: grid; gap: 18px; }
    .empty-text { color: var(--placeholder); font-size: 13px; }

    .table-wrap {
      overflow: auto;
      border: 1px solid var(--border);
      border-radius: 16px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      background: #fff;
    }

    th, td {
      border-bottom: 1px solid var(--border);
      padding: 10px 12px;
      text-align: left;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }

    th {
      position: sticky;
      top: 0;
      background: #f8f5f0;
      font-weight: 700;
      z-index: 1;
    }

    tr:last-child td { border-bottom: 0; }
    .percent { color: var(--primary); font-weight: 800; }
    .warn-text { color: #956000; }

    .review-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }

    .review-table-wrap {
      max-height: 66vh;
    }

    .review-table {
      min-width: 2380px;
      table-layout: fixed;
    }

    .review-table th,
    .review-table td {
      width: 130px;
      vertical-align: top;
      overflow: hidden;
      text-overflow: ellipsis;
      position: relative;
    }

    .review-table th:first-child,
    .review-table td:first-child {
      width: 150px;
    }

    .review-table th[data-field="model_eval_name"],
    .review-table td[data-field="model_eval_name"],
    .review-table th[data-field="model_eval_report"],
    .review-table td[data-field="model_eval_report"],
    .review-table th[data-field="model_eval_link"],
    .review-table td[data-field="model_eval_link"],
    .review-table th[data-field="training_data_link"],
    .review-table td[data-field="training_data_link"] {
      width: 220px;
    }

    .resize-handle {
      position: absolute;
      top: 0;
      right: -4px;
      z-index: 5;
      width: 8px;
      height: 100%;
      cursor: col-resize;
      user-select: none;
      touch-action: none;
    }

    .resize-handle::after {
      content: "";
      position: absolute;
      top: 8px;
      bottom: 8px;
      left: 3px;
      width: 2px;
      border-radius: 999px;
      background: transparent;
    }

    .review-table th:hover .resize-handle::after,
    .resize-handle.active::after {
      background: rgba(51,119,255,.45);
    }

    .review-table th:first-child,
    .review-table td:first-child {
      position: sticky;
      left: 0;
      z-index: 2;
      background: #fff;
    }

    .review-table th:first-child {
      z-index: 3;
      background: #f8f5f0;
    }

    .review-table td[contenteditable="true"] {
      cursor: text;
      background: #fff;
    }

    .review-table td[contenteditable="true"]:focus {
      outline: 2px solid rgba(242,90,29,.32);
      outline-offset: -2px;
      background: rgba(242,90,29,.05);
    }

    .row-index {
      color: var(--muted);
      font-weight: 700;
    }

    .review-stat {
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 12px;
      background: #fff;
      box-shadow: var(--soft-shadow);
    }

    .review-stat strong {
      display: block;
      color: var(--text);
      font-size: 20px;
      line-height: 1.2;
    }

    .review-stat span {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 12px;
    }

    .review-empty {
      border: 1px dashed var(--border);
      border-radius: 10px;
      padding: 18px;
      color: var(--muted);
      background: var(--surface-soft);
      text-align: center;
      font-size: 13px;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: none;
      background: rgba(17, 20, 26, .36);
      padding: 24px;
      overflow: auto;
    }

    .modal-backdrop.show { display: block; }
    body.modal-open { overflow: hidden; }

    .modal-panel {
      width: min(1180px, 100%);
      margin: 0 auto;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 24px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      gap: 14px;
      align-items: flex-start;
      padding: 18px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }

    .modal-title { margin: 0; font-size: 18px; font-weight: 800; }
    .modal-body { padding: 18px; }
    .modal-grid { display: grid; grid-template-columns: 340px minmax(0, 1fr); gap: 18px; align-items: start; }
    .main-review { display: grid; gap: 18px; }
    .dashboard-shell { display: grid; gap: 18px; }

    .main-review,
    .dashboard-shell {
      padding: 0 40px 40px;
      min-width: 0;
    }

    .dashboard-shell {
      padding-top: 10px;
    }

    .dashboard-titlebar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .dashboard-titlebar h2 {
      margin: 0;
      font-size: 22px;
      font-weight: 900;
    }

    .dashboard-titlebar p {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      grid-template-rows: repeat(2, minmax(330px, 1fr));
      gap: 16px;
      align-items: stretch;
    }

    .dashboard-module-wide { min-width: 0; }
    .dashboard-module[data-dashboard-module="total"] { grid-area: 1 / 1; }
    .dashboard-module[data-dashboard-module="trend"] { grid-area: 1 / 2; }
    .dashboard-module[data-dashboard-module="latest"] { grid-area: 2 / 1; }
    .dashboard-module[data-dashboard-module="comparison"] { grid-area: 2 / 2; }

    .dashboard-placeholder {
      min-height: 220px;
      color: var(--muted);
      text-align: center;
      padding: 28px;
      border: 1px dashed #d9cfe4;
      border-radius: 18px;
      background: #fbf7ff;
    }

    .dashboard-module {
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      background: #fff;
      box-shadow: var(--soft-shadow);
      min-width: 0;
      min-height: 330px;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
    }

    .dashboard-module.metric-module {
      display: grid;
      grid-template-rows: auto 1fr;
    }

    .dashboard-module-head {
      display: flex;
      gap: 12px;
      justify-content: space-between;
      align-items: flex-start;
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      background: #fff;
    }

    .dashboard-module-title {
      margin: 0;
      font-size: 15px;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .dashboard-module-title::before {
      content: "⋮";
      color: #b9b2aa;
      font-weight: 900;
      line-height: 1;
    }

    .dashboard-module-desc {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 12px;
    }

    .metric-body {
      display: grid;
      place-items: center;
      min-height: 0;
      padding: 16px;
      text-align: center;
    }

    .metric-label {
      margin: 0 0 16px;
      font-size: 18px;
      font-weight: 900;
    }

    .metric-value {
      color: #bd14df;
      font-size: clamp(54px, 6vw, 86px);
      font-weight: 900;
      line-height: .9;
    }

    .metric-sub {
      margin-top: 14px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    .summary-list {
      display: grid;
      gap: 12px;
      padding: 18px;
      align-content: start;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      padding: 12px 14px;
      border-radius: 12px;
      background: var(--surface-soft);
    }

    .summary-row span {
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .summary-row strong {
      font-size: 18px;
      font-weight: 900;
    }

    .field-menu-wrap { position: relative; }

    .dashboard-controls {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .icon-btn {
      width: 34px;
      min-width: 34px;
      height: 34px;
      min-height: 34px;
      padding: 0;
      border-radius: 12px;
      color: #fff;
      background: var(--ink);
      font-size: 18px;
      font-weight: 800;
      line-height: 1;
    }

    .field-menu {
      position: absolute;
      top: calc(100% + 8px);
      right: 0;
      z-index: 10;
      width: 240px;
      max-height: 320px;
      overflow: auto;
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: var(--shadow);
      background: #fff;
      padding: 8px;
    }

    .model-menu { width: 320px; }

    .field-menu[hidden] { display: none; }

    .field-option {
      display: flex;
      gap: 8px;
      align-items: center;
      padding: 7px 8px;
      border-radius: 8px;
      color: var(--text);
      font-size: 13px;
      font-weight: 600;
    }

    .field-option:hover { background: var(--surface-soft); }
    .field-option input { width: auto; }

    .model-option-text {
      display: grid;
      gap: 2px;
      min-width: 0;
    }

    .model-option-text strong,
    .model-option-text span {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .model-option-text span {
      color: var(--muted);
      font-size: 12px;
      font-weight: 500;
    }

    .trend-chart-wrap {
      position: relative;
      min-height: 0;
      padding: 12px 14px 14px;
      overflow: hidden;
    }

    .trend-chart {
      width: 100%;
      min-width: 760px;
      height: 224px;
      display: block;
    }

    .chart-scroll {
      overflow-x: auto;
      overflow-y: hidden;
      padding-bottom: 6px;
    }

    .chart-legend {
      display: flex;
      gap: 8px 14px;
      align-items: center;
      flex-wrap: wrap;
      margin-top: 10px;
    }

    .legend-item {
      display: inline-flex;
      gap: 6px;
      align-items: center;
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
    }

    .legend-swatch {
      width: 10px;
      height: 10px;
      border-radius: 999px;
    }

    .chart-tooltip {
      position: fixed;
      z-index: 30;
      pointer-events: none;
      min-width: 180px;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 10px;
      color: var(--text);
      background: rgba(255,255,255,.96);
      box-shadow: var(--shadow);
      font-size: 12px;
      line-height: 1.6;
    }

    .chart-tooltip[hidden] { display: none; }
    .record-name { font-weight: 700; color: var(--text); }
    .record-meta { color: var(--muted); font-size: 12px; }

    .comparison-wrap {
      display: grid;
      gap: 14px;
      padding: 12px 14px 14px;
      min-height: 0;
      overflow: hidden;
    }

    .comparison-chart-scroll {
      overflow-x: auto;
      overflow-y: hidden;
      padding-bottom: 6px;
    }

    .comparison-chart {
      width: 100%;
      min-width: 940px;
      height: 218px;
      display: block;
    }

    .module-expand-btn {
      width: 32px;
      min-width: 32px;
      height: 32px;
      min-height: 32px;
      padding: 0;
      border-radius: 10px;
      color: var(--ink);
      background: var(--surface-soft);
      font-size: 16px;
      line-height: 1;
    }

    .dashboard-view-modal {
      z-index: 28;
      padding: 18px;
    }

    .dashboard-view-panel {
      width: min(1380px, 100%);
      min-height: calc(100vh - 36px);
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
    }

    .dashboard-view-body {
      min-height: 0;
      padding: 16px;
    }

    .dashboard-view-stage {
      min-height: calc(100vh - 136px);
      border: 1px solid var(--border);
      border-radius: 14px;
      background: #fff;
      overflow: hidden;
    }

    .dashboard-view-stage .trend-chart-wrap,
    .dashboard-view-stage .comparison-wrap {
      min-height: calc(100vh - 154px);
      padding: 18px;
    }

    .dashboard-view-stage .trend-chart {
      height: min(68vh, 680px);
      min-width: 1080px;
    }

    .dashboard-view-stage .comparison-chart {
      height: min(68vh, 680px);
      min-width: 1160px;
    }

    .dashboard-view-stage .summary-list {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .comparison-legend {
      display: flex;
      gap: 10px 18px;
      align-items: center;
      flex-wrap: wrap;
    }

    .comparison-empty {
      min-height: 132px;
      display: grid;
      place-items: center;
      padding: 24px;
      color: var(--muted);
      text-align: center;
      border: 1px dashed var(--border);
      border-radius: 10px;
      background: var(--surface-soft);
      font-size: 13px;
    }

    @media (max-width: 980px) {
      .page {
        width: 100%;
        min-height: 100vh;
        display: block;
      }
      .hero, .grid { grid-template-columns: 1fr; }
      .hero-actions { justify-content: flex-start; }
      .page-nav {
        flex-direction: row;
        padding: 0 20px 18px;
        border-right: 0;
        border-bottom: 1px solid var(--border);
        background: transparent;
      }
      .page-tab { flex: 1; justify-content: center; }
      .main-review,
      .dashboard-shell {
        padding: 20px;
      }
      .review-grid, .modal-grid, .dashboard-grid { grid-template-columns: 1fr; }
      .dashboard-grid {
        grid-template-rows: auto;
      }
      .dashboard-module[data-dashboard-module="total"],
      .dashboard-module[data-dashboard-module="trend"],
      .dashboard-module[data-dashboard-module="latest"],
      .dashboard-module[data-dashboard-module="comparison"] {
        grid-area: auto;
      }
    }

    @media (max-width: 560px) {
      .page { width: 100%; margin: 0; }
      .hero { padding: 22px 18px 18px; }
      h1 { font-size: 26px; }

    const MetricFieldFactory = (() => {

    class ZipReader {
      constructor(buffer) {
        this.buffer = buffer;
        this.view = new DataView(buffer);
        this.files = new Map();
      }

      async init() {
        const eocdOffset = this.findEndOfCentralDirectory();
        if (eocdOffset < 0) throw new Error('未找到 xlsx 中央目录');
        const totalEntries = this.view.getUint16(eocdOffset + 10, true);
        const centralOffset = this.view.getUint32(eocdOffset + 16, true);
        let offset = centralOffset;
        for (let index = 0; index < totalEntries; index += 1) {
          if (this.view.getUint32(offset, true) !== 0x02014b50) throw new Error('xlsx 中央目录格式异常');
          const method = this.view.getUint16(offset + 10, true);
          const compressedSize = this.view.getUint32(offset + 20, true);
          const uncompressedSize = this.view.getUint32(offset + 24, true);
          const fileNameLength = this.view.getUint16(offset + 28, true);
          const extraLength = this.view.getUint16(offset + 30, true);
          const commentLength = this.view.getUint16(offset + 32, true);
          const localOffset = this.view.getUint32(offset + 42, true);
          const name = this.decodeBytes(offset + 46, fileNameLength);
          this.files.set(name, { method, compressedSize, uncompressedSize, localOffset });
          offset += 46 + fileNameLength + extraLength + commentLength;
        }
      }

      findEndOfCentralDirectory() {
        const min = Math.max(0, this.view.byteLength - 65557);
        for (let offset = this.view.byteLength - 22; offset >= min; offset -= 1) {
          if (this.view.getUint32(offset, true) === 0x06054b50) return offset;
        }
        return -1;
      }

      decodeBytes(offset, length) {
        return new TextDecoder('utf-8').decode(new Uint8Array(this.buffer, offset, length));
      }

      async text(name) {
        const bytes = await this.bytes(name);
        return new TextDecoder('utf-8').decode(bytes);
      }

      async bytes(name) {
        const entry = this.files.get(name);
        if (!entry) throw new Error(`xlsx 缺少文件：${name}`);
        const local = entry.localOffset;
        if (this.view.getUint32(local, true) !== 0x04034b50) throw new Error('xlsx 本地文件头格式异常');
        const fileNameLength = this.view.getUint16(local + 26, true);
        const extraLength = this.view.getUint16(local + 28, true);
        const dataOffset = local + 30 + fileNameLength + extraLength;
        const compressed = new Uint8Array(this.buffer, dataOffset, entry.compressedSize);
        if (entry.method === 0) return compressed;
        if (entry.method !== 8) throw new Error(`不支持的 xlsx 压缩方式：${entry.method}`);
        if (!('DecompressionStream' in window)) throw new Error('当前浏览器不支持本地解压，请使用新版 Chrome/Edge');
        const stream = new Blob([compressed]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
        return new Uint8Array(await new Response(stream).arrayBuffer());
      }
    }

    class LightweightXlsxParser {
      async parse(file) {
        const buffer = await file.arrayBuffer();
        const zip = new ZipReader(buffer);
        await zip.init();
        const workbookDoc = this.parseXml(await zip.text('xl/workbook.xml'));
        const relsDoc = this.parseXml(await zip.text('xl/_rels/workbook.xml.rels'));
        const sharedStrings = await this.readSharedStrings(zip);
        const sheets = this.readWorkbookSheets(workbookDoc, relsDoc);
        const parsedSheets = [];
        for (const sheetMeta of sheets) {
          const xml = await zip.text(`xl/${sheetMeta.path}`);
          parsedSheets.push(this.parseSheet(sheetMeta.name, xml, sharedStrings));
        }
        return { fileName: file.name, sheets: parsedSheets };
      }

      parseXml(xml) {
        const doc = new DOMParser().parseFromString(xml, 'application/xml');
        if (doc.querySelector('parsererror')) throw new Error('xlsx XML 解析失败');
        return doc;
      }

      async readSharedStrings(zip) {
        if (!zip.files.has('xl/sharedStrings.xml')) return [];
        const doc = this.parseXml(await zip.text('xl/sharedStrings.xml'));
        return Array.from(doc.getElementsByTagName('si')).map(item => {
          const textNodes = Array.from(item.getElementsByTagName('t'));
          return textNodes.map(node => node.textContent || '').join('');
        });
      }

      readWorkbookSheets(workbookDoc, relsDoc) {
        const rels = new Map(Array.from(relsDoc.getElementsByTagName('Relationship')).map(rel => [rel.getAttribute('Id'), rel.getAttribute('Target')]));
        return Array.from(workbookDoc.getElementsByTagName('sheet')).map(sheet => {
          const relId = sheet.getAttribute('r:id') || sheet.getAttribute('id');
          const target = rels.get(relId);
          if (!target) throw new Error(`未找到 sheet 关系：${sheet.getAttribute('name')}`);
          return { name: sheet.getAttribute('name') || 'Sheet', path: target.replace(/^\//, '').replace(/^xl\//, '') };
        });
      }

      parseSheet(name, xml, sharedStrings) {
        const doc = this.parseXml(xml);
        const rowNodes = Array.from(doc.getElementsByTagName('row'));
        const matrix = [];
        for (const rowNode of rowNodes) {
          const rowIndex = Number(rowNode.getAttribute('r') || matrix.length + 1) - 1;
          matrix[rowIndex] = matrix[rowIndex] || [];
          for (const cell of Array.from(rowNode.getElementsByTagName('c'))) {
            const ref = cell.getAttribute('r') || '';
            const columnIndex = this.columnNameToIndex(ref.replace(/[0-9]/g, ''));
            matrix[rowIndex][columnIndex] = this.readCellValue(cell, sharedStrings);
          }
        }
        const firstNonEmptyIndex = matrix.findIndex(row => row && row.some(value => this.normalize(value) !== ''));
        if (firstNonEmptyIndex < 0) return { name, headers: [], rows: [] };
        const headers = this.normalizeHeaders(matrix[firstNonEmptyIndex]);
        const rows = matrix.slice(firstNonEmptyIndex + 1).map(row => {
          const record = {};
          headers.forEach((header, index) => { record[header] = row ? row[index] ?? '' : ''; });
          return record;
        }).filter(record => headers.some(header => this.normalize(record[header]) !== ''));
        return { name, headers, rows };
      }

      readCellValue(cell, sharedStrings) {
        const type = cell.getAttribute('t');
        if (type === 'inlineStr') {
          return Array.from(cell.getElementsByTagName('t')).map(node => node.textContent || '').join('');
        }
        const valueNode = cell.getElementsByTagName('v')[0];
        const raw = valueNode ? valueNode.textContent || '' : '';
        if (type === 's') return sharedStrings[Number(raw)] ?? '';
        if (type === 'b') return raw === '1' ? 'TRUE' : 'FALSE';
        return raw;
      }

      columnNameToIndex(name) {
        let index = 0;
        for (const char of name) index = index * 26 + char.charCodeAt(0) - 64;
        return Math.max(0, index - 1);
      }

      normalize(value) { return value === null || value === undefined ? '' : String(value).trim(); }

      normalizeHeaders(row = []) {
        const seen = new Map();
        return row.map((value, index) => {
          const base = this.normalize(value) || `未命名列_${index + 1}`;
          const count = (seen.get(base) || 0) + 1;
          seen.set(base, count);
          return count === 1 ? base : `${base}_${count}`;
        });
      }
    }

    class LocalExcelLoader {
      constructor() { this.parser = new LightweightXlsxParser(); }
      async load(file) {
        if (!file) throw new Error('请先上传本地 Excel 文件');
        const lowerName = file.name.toLowerCase();

        if (!lowerName.endsWith('.xlsx')) throw new Error('仅支持 .xlsx 文件');
        return this.parser.parse(file);
      }
    }

    class IterationTableWorkbook {
      constructor() { this.parser = new LightweightXlsxParser(); }

      async import(file) {
        if (!file) throw new Error('请选择迭代记录表 Excel');
        const lowerName = file.name.toLowerCase();
        if (!lowerName.endsWith('.xlsx')) throw new Error('迭代记录表仅支持 .xlsx 文件');
        const workbook = await this.parser.parse(file);
        const sheet = workbook.sheets[0];
        if (!sheet) throw new Error('迭代记录表为空');
        const { fields, metricFields } = this.fieldsFromHeaders(sheet.headers);
        const records = sheet.rows.map((row, index) => this.rowToRecord(row, index, fields)).filter(record => this.hasContent(record.data));
        return { records, metricFields };
      }

      export(records, metricFields) {
        const fields = [...FieldConfig.manual(), ...(metricFields || [])];
        const headers = this.headers(metricFields);
        const rows = records.map(record => [
          this.formatExportTime(record.createdAt),
          ...fields.map(field => record.data?.[field.key] || '')
        ]);
        const sheetXml = this.sheetXml([headers, ...rows]);
        const files = {
          '[Content_Types].xml': this.contentTypesXml(),
          '_rels/.rels': this.rootRelsXml(),
          'xl/workbook.xml': this.workbookXml(),
          'xl/_rels/workbook.xml.rels': this.workbookRelsXml(),
          'xl/worksheets/sheet1.xml': sheetXml
        };
        const blob = new Blob([this.zip(files)], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        const fileName = `模型迭代记录表_${this.dateStamp()}.xlsx`;
        link.download = fileName;
        document.body.appendChild(link);
        link.click();
        link.remove();
        setTimeout(() => URL.revokeObjectURL(link.href), 0);
        return fileName;
      }

      headers(metricFields = []) {
        return ['记录时间', ...FieldConfig.manual().map(field => field.name), ...metricFields.map(field => field.name)];
      }

      fieldsFromHeaders(headers) {
        const manualFields = FieldConfig.manual();
        const manualByName = new Map(manualFields.map(field => [field.name, field]));
        manualByName.set('年月日', manualFields.find(field => field.key === 'eval_date'));
        const metricByKey = new Map();
        const fieldByHeader = [];
        for (const header of headers || []) {
          if (header === '记录时间') continue;
          const manualField = manualByName.get(header);
          if (manualField) {
            fieldByHeader.push({ header, field: manualField });
            continue;
          }
          const metricField = MetricFieldFactory.fromHeader(header);
          if (!metricField.name || !MetricFieldFactory.normalizeName(metricField.name)) continue;
          if (!metricByKey.has(metricField.key)) metricByKey.set(metricField.key, metricField);
          fieldByHeader.push({ header, field: metricByKey.get(metricField.key) });
        }
        return { fields: fieldByHeader, metricFields: Array.from(metricByKey.values()) };
      }

      rowToRecord(row, index, fields) {
        const data = {};
        fields.forEach(({ header, field }) => {
          data[field.key] = this.clean(row[header]);
        });
        return {
          id: `record_${Date.now()}_${index}`,
          createdAt: this.parseImportedTime(row['记录时间']) || new Date().toISOString(),
          sourceText: '',
          data
        };
      }

      hasContent(data) {
        return Object.values(data || {}).some(value => this.clean(value));
      }

      clean(value) {
        return String(value ?? '').replace(/[\r\n\t]+/g, ' ').trim();
      }

      parseImportedTime(value) {
        const text = this.clean(value);
        if (!text) return '';
        if (/^\d+(\.\d+)?$/.test(text)) {
          const date = new Date((Number(text) - 25569) * 86400 * 1000);
          if (!Number.isNaN(date.getTime())) return date.toISOString();
        }
        const normalized = text.replace(/\//g, '-');
        const date = new Date(normalized);
        return Number.isNaN(date.getTime()) ? text : date.toISOString();
      }

      formatExportTime(value) {
        if (!value) return '';
        const date = new Date(value);
        if (Number.isNaN(date.getTime())) return value;
        const pad = number => String(number).padStart(2, '0');
        return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())} ${pad(date.getHours())}:${pad(date.getMinutes())}`;
      }

      dateStamp() {
        const date = new Date();
        const pad = number => String(number).padStart(2, '0');
        return `${date.getFullYear()}${pad(date.getMonth() + 1)}${pad(date.getDate())}_${pad(date.getHours())}${pad(date.getMinutes())}`;
      }

      sheetXml(rows) {
        return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>` +
          `<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">` +
          `<sheetData>${rows.map((row, rowIndex) => `<row r="${rowIndex + 1}">${row.map((value, columnIndex) => this.cellXml(rowIndex + 1, columnIndex, value)).join('')}</row>`).join('')}</sheetData>` +
          `</worksheet>`;
      }

      cellXml(rowIndex, columnIndex, value) {
        const ref = `${this.columnName(columnIndex)}${rowIndex}`;
        return `<c r="${ref}" t="inlineStr"><is><t>${this.xmlEscape(value)}</t></is></c>`;
      }

      columnName(index) {
        let name = '';
        let value = index + 1;
        while (value > 0) {
          const remainder = (value - 1) % 26;
          name = String.fromCharCode(65 + remainder) + name;
          value = Math.floor((value - 1) / 26);
        }
        return name;
      }

      contentTypesXml() {
        return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/></Types>`;
      }

      rootRelsXml() {
        return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>`;
      }

      workbookXml() {
        return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="模型迭代记录表" sheetId="1" r:id="rId1"/></sheets></workbook>`;
      }

      workbookRelsXml() {
        return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/></Relationships>`;
      }

      zip(files) {
        const encoder = new TextEncoder();
        const entries = Object.entries(files).map(([name, text]) => ({ name, bytes: encoder.encode(text) }));
        let offset = 0;
        const localParts = [];
        const centralParts = [];
        for (const entry of entries) {
          const nameBytes = encoder.encode(entry.name);
          const crc = this.crc32(entry.bytes);
          const local = this.concat(
            this.u32(0x04034b50), this.u16(20), this.u16(0), this.u16(0), this.u16(0), this.u16(0),
            this.u32(crc), this.u32(entry.bytes.length), this.u32(entry.bytes.length), this.u16(nameBytes.length), this.u16(0),
            nameBytes, entry.bytes
          );
          const central = this.concat(
            this.u32(0x02014b50), this.u16(20), this.u16(20), this.u16(0), this.u16(0), this.u16(0), this.u16(0),
            this.u32(crc), this.u32(entry.bytes.length), this.u32(entry.bytes.length), this.u16(nameBytes.length), this.u16(0), this.u16(0),
            this.u16(0), this.u16(0), this.u32(0), this.u32(offset), nameBytes
          );
          localParts.push(local);
          centralParts.push(central);
          offset += local.length;
        }
        const centralOffset = offset;
        const central = this.concat(...centralParts);
        const end = this.concat(
          this.u32(0x06054b50), this.u16(0), this.u16(0), this.u16(entries.length), this.u16(entries.length),
          this.u32(central.length), this.u32(centralOffset), this.u16(0)
        );
        return this.concat(...localParts, central, end);
      }

      crc32(bytes) {
        let crc = -1;
        for (const byte of bytes) {
          crc ^= byte;
          for (let bit = 0; bit < 8; bit += 1) crc = (crc >>> 1) ^ (0xedb88320 & -(crc & 1));
        }
        return (crc ^ -1) >>> 0;
      }

      u16(value) {
        const bytes = new Uint8Array(2);
        new DataView(bytes.buffer).setUint16(0, value, true);
        return bytes;
      }

      u32(value) {
        const bytes = new Uint8Array(4);
        new DataView(bytes.buffer).setUint32(0, value >>> 0, true);
        return bytes;
      }

      concat(...parts) {
        const total = parts.reduce((sum, part) => sum + part.length, 0);
        const output = new Uint8Array(total);
        let offset = 0;
        for (const part of parts) {
          output.set(part, offset);
          offset += part.length;
        }
        return output;
      }

      xmlEscape(value) {
        return String(value ?? '').replace(/[<>&'"]/g, char => ({ '<': '&lt;', '>': '&gt;', '&': '&amp;', "'": '&apos;', '"': '&quot;' }[char]));
      }
    }

    class AutoColumnDetector {
      detect(workbook) {
        const mappings = {};
        const fieldByKey = new Map();
        const ignoredQualityColumns = [];

        for (const sheet of workbook?.sheets || []) {
          for (const header of sheet.headers || []) {
            if (!String(header || '').includes('质检')) continue;
            if (!this.isQualityColumn(header)) {
              ignoredQualityColumns.push({ sheetName: sheet.name, columnName: header });
              continue;
            }
            const values = sheet.rows.map(row => row[header]);
            if (!this.hasScoreData(values)) {
              ignoredQualityColumns.push({ sheetName: sheet.name, columnName: header });
              continue;
            }
            const field = MetricFieldFactory.fromHeader(header);
            if (!field.name || !MetricFieldFactory.normalizeName(field.name)) continue;
            if (!fieldByKey.has(field.key)) fieldByKey.set(field.key, field);
            if (!mappings[field.key]) mappings[field.key] = [];
            mappings[field.key].push({ sheetName: sheet.name, columnName: header });
          }
        }

        const fields = Array.from(fieldByKey.values());
        const matchedColumnCount = Object.values(mappings).reduce((sum, refs) => sum + refs.length, 0);
        return {
          fields,
          mappings,
          matchedFieldCount: fields.length,
          matchedColumnCount,
          sheetCount: workbook?.sheets?.length || 0,
          ignoredQualityColumns
        };
      }

      isQualityColumn(header) {
        const text = String(header || '');
        if (!text.includes('质检')) return false;
        return !/(质检状态|标签|备注|质检合成检查)$/i.test(text);
      }

      hasScoreData(values) {
        return values.some(value => {
          const normalized = value === null || value === undefined ? '' : String(value).trim();
          return normalized === '0' || normalized === '1' || normalized === '2';
        });
      }
    }

    class AvailabilityCalculator {
      calculate(workbook, mappings, fields) {
        const results = {};
        for (const field of fields || []) {
          const refs = mappings[field.key] || [];
          const values = refs.flatMap(ref => this.getColumnValues(workbook, ref.sheetName, ref.columnName));
          results[field.key] = this.calculateValues(values);
        }
        return results;
      }
      getColumnValues(workbook, sheetName, columnName) {
        const sheet = workbook?.sheets?.find(item => item.name === sheetName);
        if (!sheet) return [];
        return sheet.rows.map(row => row[columnName]);
      }
      calculateValues(values) {
        let usableCount = 0;
        let totalCount = 0;
        let invalidCount = 0;
        for (const value of values) {
          const normalized = value === null || value === undefined ? '' : String(value).trim();
          if (!normalized) continue;
          if (normalized === '0' || normalized === '1' || normalized === '2') {
            totalCount += 1;
            if (normalized === '1' || normalized === '2') usableCount += 1;
          } else {
            invalidCount += 1;
          }
        }
        return {
          usableCount,
          totalCount,
          invalidCount,
          value: totalCount ? `${((usableCount / totalCount) * 100).toFixed(2)}%` : ''
        };
      }
    }

    class CopyRowGenerator {
      generate(manualValues, results, fields) {
        return fields.map(field => {
          const value = field.source === 'manual' ? manualValues[field.key] || '' : results[field.key]?.value || '';
          return String(value).replace(/[\t\r\n]+/g, ' ').trim();
        }).join('\t');
      }
    }

    class TabRowParser {
      parse(text, fields) {
        const values = String(text || '').split('\t');
        return fields.reduce((record, field, index) => {
          record[field.key] = String(values[index] || '').replace(/[\r\n]+/g, ' ').trim();
          return record;
        }, {});
      }

      countColumns(text) {
        return String(text || '').trim() ? String(text || '').split('\t').length : 0;
      }
    }
