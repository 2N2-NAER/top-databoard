      switchPage(page) {
        this.el.pagePanels.forEach(panel => {
          panel.hidden = panel.dataset.page !== page;
        });
        this.el.pageTabs.forEach(tab => {
          const isActive = tab.dataset.pageTarget === page;
          tab.classList.toggle('active', isActive);
          tab.setAttribute('aria-pressed', String(isActive));
        });
        if (page === 'dashboard') this.renderDashboard();
      }

      legacyMetricField(field) {
        const name = field.key === 'final_score_availability'
          ? '最终得分'
          : MetricFieldFactory.displayName(field.name);
        return { key: MetricFieldFactory.keyFromName(name), name, type: 'percent', source: 'calculated' };
      }

      migrateLegacyRecords(records) {
        const legacyFields = FieldConfig.legacyCalculated();
        records.forEach(record => {
          record.data = record.data || {};
          legacyFields.forEach(legacy => {
            if (!(legacy.key in record.data)) return;
            const dynamicField = this.legacyMetricField(legacy);
            if (!(dynamicField.key in record.data)) record.data[dynamicField.key] = record.data[legacy.key];
            delete record.data[legacy.key];
          });
        });
      }

      resolveMetricFields(savedFields, records) {
        const byKey = new Map();
        const add = field => {
          const normalized = MetricFieldFactory.normalizeField(field);
          if (!normalized.name || !normalized.key || byKey.has(normalized.key)) return;
          byKey.set(normalized.key, normalized);
        };
        (savedFields || []).forEach(add);
        FieldConfig.legacyCalculated().forEach(legacy => {
          const field = this.legacyMetricField(legacy);
          if (records.some(record => String(record.data?.[field.key] ?? '').trim())) add(field);
        });
        const recordKeys = new Set(records.flatMap(record => Object.keys(record.data || {})));
        Array.from(recordKeys).filter(key => key.startsWith('metric:')).forEach(key => {
          if (!byKey.has(key)) add({ key, name: key.slice(7) });
        });
        return Array.from(byKey.values());
      }

      mergeMetricFields(incomingFields) {
        const known = new Set(this.metricFields.map(field => field.key));
        let added = 0;
        for (const field of incomingFields || []) {
          if (known.has(field.key)) continue;
          this.metricFields.push(MetricFieldFactory.normalizeField(field));
          this.dashboardFields[field.key] = true;
          known.add(field.key);
          added += 1;
        }
        return added;
      }

      allFields() {
        return [...FieldConfig.manual(), ...this.metricFields];
      }

      metricFieldByName(name) {
        const normalized = MetricFieldFactory.normalizeName(name);
        return this.metricFields.find(field => MetricFieldFactory.normalizeName(field.name) === normalized);
      }

      metricValue(record, name) {
        const field = this.metricFieldByName(name);
        return field ? record?.data?.[field.key] || '' : '';
      }

      latestMetricRows(record, limit = 2) {
        const preferredNames = ['最终得分', '基础质量'];
        const ordered = [];
        preferredNames.forEach(name => {
          const field = this.metricFieldByName(name);
          if (field && !ordered.some(item => item.key === field.key)) ordered.push(field);
        });
        this.metricFields.forEach(field => {
          if (!ordered.some(item => item.key === field.key)) ordered.push(field);
        });
        return ordered.slice(0, limit).map(field => [field.name, record?.data?.[field.key] || '-']);
      }

      normalizeDashboardFields(saved) {
        return this.metricFields.reduce((fields, field) => {
          fields[field.key] = saved[field.key] !== false;
          return fields;
        }, {});
      }

      renderDimensionMenu() {
        if (!this.metricFields.length) {
          this.el.dimensionMenu.innerHTML = '<div class="empty-text">暂无得分字段</div>';
          return;
        }
        this.el.dimensionMenu.innerHTML = this.metricFields.map((field, index) => `
          <label class="field-option">
            <input type="checkbox" data-dashboard-field="${this.escape(field.key)}" ${this.dashboardFields[field.key] ? 'checked' : ''} />
            <span class="legend-swatch" style="background:${this.chartColors[index % this.chartColors.length]}"></span>
            <span>${this.escape(field.name)}</span>
          </label>
        `).join('');
      }

      toggleDimensionMenu() {
        const nextHidden = !this.el.dimensionMenu.hidden;
        this.el.dimensionMenu.hidden = nextHidden;
        this.el.dimensionMenuBtn.setAttribute('aria-expanded', String(!nextHidden));
      }

      closeDimensionMenu() {
        this.el.dimensionMenu.hidden = true;
        this.el.dimensionMenuBtn.setAttribute('aria-expanded', 'false');
      }

      handleDimensionToggle(event) {
        const input = event.target.closest('[data-dashboard-field]');
        if (!input) return;
        this.dashboardFields[input.dataset.dashboardField] = input.checked;
        this.renderDashboard();
        this.saveState();
      }

      renderModelMenu() {
        const records = this.records.slice().sort((a, b) => {
          const dateA = this.parseChartDate(a.data?.eval_date || a.createdAt)?.getTime() || 0;
          const dateB = this.parseChartDate(b.data?.eval_date || b.createdAt)?.getTime() || 0;
          return dateA - dateB;
        });
        if (!records.length) {
          this.el.modelMenu.innerHTML = '<div class="empty-text">暂无模型记录</div>';
          return;
        }
        this.el.modelMenu.innerHTML = records.map(record => {
          const checked = this.dashboardModels[record.id] !== false;
          const date = this.parseChartDate(record.data?.eval_date || record.createdAt);
          const dateLabel = date ? this.formatChartDate(date) : '-';
          const name = record.data?.model_eval_name || '未命名模型';
          return `
            <label class="field-option">
              <input type="checkbox" data-dashboard-model="${this.escape(record.id)}" ${checked ? 'checked' : ''} />
              <span class="model-option-text">
                <strong>${this.escape(name)}</strong>
                <span>${this.escape(dateLabel)}</span>
              </span>
            </label>
          `;
        }).join('');
      }

      toggleModelMenu() {
        const nextHidden = !this.el.modelMenu.hidden;
        this.el.modelMenu.hidden = nextHidden;
        this.el.modelMenuBtn.setAttribute('aria-expanded', String(!nextHidden));
      }

      closeModelMenu() {
        this.el.modelMenu.hidden = true;
        this.el.modelMenuBtn.setAttribute('aria-expanded', 'false');
      }

      openDashboardView(moduleKey) {
        const titles = {
          total: '当前记录数',
          trend: '评估维度趋势折线图',
          latest: '最新版本摘要',
          comparison: '版本对比看板'
        };
        this.el.dashboardViewTitle.textContent = titles[moduleKey] || '看板详情';
        this.renderDashboardView(moduleKey);
        this.el.dashboardViewModal.classList.add('show');
        this.el.dashboardViewModal.setAttribute('aria-hidden', 'false');
        document.body.classList.add('modal-open');
      }

      closeDashboardView() {
        this.el.dashboardViewModal.classList.remove('show');
        this.el.dashboardViewModal.setAttribute('aria-hidden', 'true');
        this.el.dashboardViewStage.innerHTML = '';
        if (!this.el.importModal.classList.contains('show')) document.body.classList.remove('modal-open');
        this.hideChartTooltip();
      }

      renderDashboardView(moduleKey) {
        if (moduleKey === 'total') {
          this.el.dashboardViewStage.innerHTML = `
            <div class="metric-body">
              <div>
                <p class="metric-label">记录总数</p>
                <div class="metric-value">${this.records.length}</div>
                <div class="metric-sub">模型迭代记录</div>
              </div>
            </div>
          `;
          return;
        }
        if (moduleKey === 'latest') {
          const latestRecord = this.records[0];
          const latest = latestRecord?.data || {};
          const rows = [
            ['最新模型', latest.model_eval_name || '-'],
            ['日期', latest.eval_date || '-'],
            ...this.latestMetricRows(latestRecord)
          ];
          this.el.dashboardViewStage.innerHTML = `
            <div class="summary-list">
              ${rows.map(([label, value]) => `
                <div class="summary-row">
                  <span>${this.escape(label)}</span>
                  <strong>${this.escape(value)}</strong>
                </div>
              `).join('')}
            </div>
          `;
          return;
        }
        if (moduleKey === 'trend') {
          const fields = this.metricFields.filter(field => this.dashboardFields[field.key]);
          const points = this.dashboardPoints();
          if (!fields.length || !points.length || !points.some(point => fields.some(field => point.values[field.key] !== null))) {
            this.el.dashboardViewStage.innerHTML = '<div class="comparison-empty">暂无数据</div>';
            return;
          }
          const chart = this.buildTrendChart(fields, points, 'expanded');
          this.el.dashboardViewStage.innerHTML = `
            <div class="trend-chart-wrap">
              <div class="chart-scroll">
                <svg class="trend-chart" viewBox="0 0 ${chart.width} ${chart.height}" style="min-width:${chart.width}px" role="img" aria-label="评估维度趋势折线图">${chart.svg}</svg>
              </div>
              <div class="chart-legend">${this.trendLegendHtml(fields)}</div>
            </div>
          `;
          this.bindChartTooltip(this.el.dashboardViewStage);
          return;
        }
        if (moduleKey === 'comparison') {
          const fields = this.metricFields;
          const records = this.records.slice(0, 2);
          if (!records.length || !fields.length) {
            this.el.dashboardViewStage.innerHTML = '<div class="comparison-empty">暂无数据</div>';
            return;
          }
          const chart = this.renderComparisonHistogram(records, fields, 'expanded');
          this.el.dashboardViewStage.innerHTML = `
            <div class="comparison-wrap">
              <div class="comparison-chart-scroll">
                <svg class="comparison-chart" viewBox="0 0 ${chart.width} ${chart.height}" style="min-width:${chart.width}px" role="img" aria-label="版本对比双列直方图">${chart.svg}</svg>
              </div>
              <div class="comparison-legend">${this.comparisonLegendHtml(records)}</div>
            </div>
          `;
          this.bindComparisonTooltip(this.el.dashboardViewStage);
        }
      }

      handleModelToggle(event) {
        const input = event.target.closest('[data-dashboard-model]');
        if (!input) return;
        this.dashboardModels[input.dataset.dashboardModel] = input.checked;
        this.renderDashboard();
        this.saveState();
      }

      async handleFile(file) {
        try {
          this.showStatus('info', '正在本地解析 Excel...');
          this.workbook = await this.loader.load(file);
          this.el.fileName.textContent = file.name;
          const addedFields = this.autoDetectColumns();
          const detection = this.detection;
          this.showStatus(
            detection.matchedFieldCount ? 'success' : 'warn',
            detection.matchedFieldCount
              ? `处理完成：识别 ${detection.matchedFieldCount} 个得分字段${addedFields ? `，评估表新增 ${addedFields} 列` : ''}`
              : '未发现包含有效 0/1/2 数据的质检得分列'
          );
        } catch (error) {
          this.workbook = null;
          this.detection = null;
          this.recalculate();
          this.showStatus('error', error.message || '文件解析失败');
        }
      }

      renderManualFields() {
        this.el.manualFields.innerHTML = FieldConfig.manual().map(field => `
          <div>
            <label for="manual_${field.key}">${this.escape(field.name)}</label>
            <input id="manual_${field.key}" data-key="${field.key}" type="${field.type === 'url' ? 'url' : field.type === 'date' ? 'date' : 'text'}" placeholder="${this.escape(field.placeholder || '')}" value="${this.escape(this.manualValues[field.key] || '')}" />
          </div>
        `).join('');
        this.el.manualFields.querySelectorAll('input').forEach(input => {
          input.addEventListener('input', () => {
            this.manualValues[input.dataset.key] = input.value;
            this.recalculate();
            this.saveState();
          });
        });
      }

      autoDetectColumns() {
        if (!this.workbook) return 0;
        this.detection = this.detector.detect(this.workbook);
        const addedFields = this.mergeMetricFields(this.detection.fields);
        this.renderReviewTable();
        this.renderDimensionMenu();
        this.renderDashboard();
        this.recalculate();
        return addedFields;
      }

      recalculate(showMessage = false) {
        const currentFields = this.detection?.fields || [];
        const mappings = this.detection?.mappings || {};
        const results = this.calculator.calculate(this.workbook, mappings, currentFields);
        this.currentResults = results;
        this.el.resultBody.innerHTML = currentFields.length ? currentFields.map(field => {
          const result = results[field.key] || { usableCount: 0, totalCount: 0, invalidCount: 0, value: '' };
          return `<tr>
            <td>${this.escape(field.name)}</td>
            <td>${result.usableCount}</td>
            <td>${result.totalCount}</td>
            <td class="${result.invalidCount ? 'warn-text' : ''}">${result.invalidCount}</td>
            <td class="percent">${result.value || '-'}</td>
          </tr>`;
        }).join('') : '<tr><td colspan="5"><span class="empty-text">上传评估 Excel 后自动生成计算结果</span></td></tr>';
        this.el.copyText.value = this.generator.generate(this.manualValues, results, this.allFields());
        if (showMessage) this.showStatus('success', '已重新计算');
      }

      async copyResult() {
        const text = this.el.copyText.value;
        if (!text.trim()) {
          this.showStatus('warn', '暂无可复制内容，请先上传 Excel 并完成自动识别');
          return;
        }
        try {
          await navigator.clipboard.writeText(text);
          this.showStatus('success', '已复制，可直接粘贴到目标多维表');
        } catch {
          this.el.copyText.focus();
          this.el.copyText.select();
          document.execCommand('copy');
          this.showStatus('success', '已选中并尝试复制，如未成功请手动复制文本框内容');
        }
      }

      openImportModal() {
        this.el.importModal.classList.add('show');
        this.el.importModal.setAttribute('aria-hidden', 'false');
        document.body.classList.add('modal-open');
      }

      closeImportModal() {
        this.el.importModal.classList.remove('show');
        this.el.importModal.setAttribute('aria-hidden', 'true');
        if (!this.el.dashboardViewModal.classList.contains('show')) document.body.classList.remove('modal-open');
      }

      importCurrentResult() {
        const text = this.el.copyText.value;
        if (!text.trim()) {
          this.showStatus('warn', '暂无可导入内容，请先上传 Excel 并完成自动识别');
          return;
        }
        const data = this.rowParser.parse(text, this.allFields());
        const record = {
          id: `record_${Date.now()}`,
          createdAt: new Date().toISOString(),
          sourceText: text,
          data
        };
        this.records.unshift(record);
        this.renderReviewTable();
        this.syncDashboardModelSelection();
        this.renderModelMenu();
        this.renderDashboard();
        this.saveState('已加入迭代记录');
        this.closeImportModal();
      }

      addManualRecord() {
        const data = this.allFields().reduce((record, field) => {
          record[field.key] = '';
          return record;
        }, {});
        this.records.unshift({
          id: `record_${Date.now()}`,
          createdAt: new Date().toISOString(),
          sourceText: '',
          data
        });
        this.renderReviewTable();
        this.syncDashboardModelSelection();
        this.renderModelMenu();
        this.renderDashboard();
        this.saveState('已新增空记录');
      }

      async importIterationWorkbook(file) {
        try {
          this.showTableStatus('正在导入迭代记录表...');
          const imported = await this.iterationWorkbook.import(file);
          this.metricFields = imported.metricFields;
          this.records = imported.records.slice().sort((a, b) => (b.createdAt || '').localeCompare(a.createdAt || ''));
          this.dashboardFields = this.normalizeDashboardFields({});
          this.renderReviewTable();
          this.renderDimensionMenu();
          this.syncDashboardModelSelection();
          this.renderModelMenu();
          this.renderDashboard();
          this.saveState(`已导入 ${this.records.length} 条迭代记录`);
        } catch (error) {
          this.showTableStatus(error.message || '迭代记录表导入失败', true);
        } finally {
          this.el.iterationImportInput.value = '';
        }
      }

      exportIterationWorkbook() {
        try {
          const fileName = this.iterationWorkbook.export(this.records, this.metricFields);
          this.showTableStatus(this.records.length ? `已导出 ${fileName}` : `暂无记录，已导出空白模板 ${fileName}`);
        } catch (error) {
          this.showTableStatus(error.message || '迭代记录表导出失败', true);
        }
      }

      renderDashboard() {
        this.syncDashboardModelSelection();
        this.renderDashboardSummary();
        this.renderVersionComparison();
        const fields = this.metricFields.filter(field => this.dashboardFields[field.key]);
        const points = this.dashboardPoints();
        if (!fields.length || !points.length || !points.some(point => fields.some(field => point.values[field.key] !== null))) {
          this.el.trendChart.removeAttribute('viewBox');
          this.el.trendChart.style.minWidth = '';
          this.el.trendChart.innerHTML = '<text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" fill="#9b948d" font-size="13">暂无趋势数据</text>';
          this.el.trendLegend.innerHTML = '';
          return;
        }
        this.renderTrendChart(fields, points);
        this.renderTrendLegend(fields);
      }

      renderDashboardSummary() {
        if (this.el.dashboardRecordTotal) this.el.dashboardRecordTotal.textContent = this.records.length;
        const latestRecord = this.records[0];
        const latest = latestRecord?.data || {};
        const rows = [
          ['最新模型', latest.model_eval_name || '-'],
          ['日期', latest.eval_date || '-'],
          ...this.latestMetricRows(latestRecord)
        ];
        if (this.el.dashboardLatestSummary) {
          this.el.dashboardLatestSummary.innerHTML = rows.map(([label, value]) => `
            <div class="summary-row">
              <span>${this.escape(label)}</span>
              <strong>${this.escape(value)}</strong>
            </div>
          `).join('');
        }
      }

      renderVersionComparison() {
        if (!this.el.versionComparison) return;
        const fields = this.metricFields;
        const records = this.records.slice(0, 2);
        if (!records.length || !fields.length) {
          this.el.versionComparison.innerHTML = '<div class="comparison-empty">暂无版本数据</div>';
          return;
        }
        const chart = this.renderComparisonHistogram(records, fields, 'compact');
        const legend = this.comparisonLegendHtml(records);
        const hint = records.length < 2 ? '<div class="hint">等待第二条模型版本</div>' : '';
        this.el.versionComparison.innerHTML = `
          <div class="comparison-chart-scroll">
            <svg class="comparison-chart" viewBox="0 0 ${chart.width} ${chart.height}" style="min-width:${chart.width}px" role="img" aria-label="版本对比双列直方图">${chart.svg}</svg>
          </div>
          <div class="comparison-legend">${legend}</div>
          ${hint}
        `;
        this.bindComparisonTooltip(this.el.versionComparison);
      }

      comparisonLegendHtml(records) {
        return records.map((record, index) => {
          const data = record?.data || {};
          const color = index === 0 ? '#3377ff' : '#f97316';
          const name = data.model_eval_name || `模型版本 ${index + 1}`;
          const date = data.eval_date || record.createdAt || '-';
          return `<span class="legend-item"><span class="legend-swatch" style="background:${color}"></span>${this.escape(name)} · ${this.escape(date)}</span>`;
        }).join('');
      }

      renderComparisonHistogram(records, fields, mode = 'compact') {
        const expanded = mode === 'expanded';
        const width = Math.max(expanded ? 1160 : 940, fields.length * (expanded ? 112 : 82) + 110);
        const height = expanded ? 560 : 320;
        const padding = { top: expanded ? 36 : 24, right: 28, bottom: expanded ? 108 : 80, left: 54 };
        const plotWidth = width - padding.left - padding.right;
        const plotHeight = height - padding.top - padding.bottom;
        const groupWidth = plotWidth / fields.length;
        const barWidth = Math.min(24, groupWidth / 4);
        const gap = 8;
        const colors = ['#3377ff', '#f97316'];
        const y = value => padding.top + (1 - value / 100) * plotHeight;
        let svg = `<svg viewBox="0 0 ${width} ${height}" xmlns="http://www.w3.org/2000/svg">`;
        [0, 25, 50, 75, 100].forEach(tick => {
          const yy = y(tick);
          svg += `<line x1="${padding.left}" y1="${yy}" x2="${width - padding.right}" y2="${yy}" stroke="#edf1f7" />`;
          svg += `<text x="${padding.left - 10}" y="${yy + 4}" text-anchor="end" fill="#878d99" font-size="12">${tick}%</text>`;
        });
        svg += `<line x1="${padding.left}" y1="${padding.top}" x2="${padding.left}" y2="${height - padding.bottom}" stroke="#cfd7e6" />`;
        svg += `<line x1="${padding.left}" y1="${height - padding.bottom}" x2="${width - padding.right}" y2="${height - padding.bottom}" stroke="#cfd7e6" />`;
        fields.forEach((field, fieldIndex) => {
          const groupCenter = padding.left + groupWidth * fieldIndex + groupWidth / 2;
          const label = field.name.length > 7 ? `${field.name.slice(0, 7)}...` : field.name;
          svg += `<text x="${groupCenter}" y="${height - padding.bottom + 24}" text-anchor="middle" fill="#6f7683" font-size="12">${this.escape(label)}</text>`;
          records.forEach((record, recordIndex) => {
            const data = record?.data || {};
            const value = this.parsePercent(data[field.key]);
            if (value === null) return;
            const x = groupCenter - barWidth - gap / 2 + recordIndex * (barWidth + gap);
            const yy = y(value);
            const barHeight = height - padding.bottom - yy;
            const modelName = data.model_eval_name || `模型版本 ${recordIndex + 1}`;
            svg += `<rect x="${x}" y="${yy}" width="${barWidth}" height="${barHeight}" rx="4" fill="${colors[recordIndex]}" data-comparison-bar="true" data-field="${this.escape(field.name)}" data-model="${this.escape(modelName)}" data-value="${value.toFixed(2)}%" />`;
          });
        });
        svg += `</svg>`;
        return {
          width,
          height,
          svg: svg.replace(/^<svg[^>]*>|<\/svg>$/g, '')
        };
      }

      bindComparisonTooltip(root = this.el.versionComparison) {
        if (!root) return;
        root.querySelectorAll('[data-comparison-bar]').forEach(bar => {
          bar.addEventListener('mouseenter', event => this.showComparisonTooltip(event));
          bar.addEventListener('mousemove', event => this.moveChartTooltip(event));
          bar.addEventListener('mouseleave', () => this.hideChartTooltip());
        });
      }

      showComparisonTooltip(event) {
        const bar = event.target;
        this.el.chartTooltip.innerHTML = `
          <strong>${this.escape(bar.dataset.field || '-')}</strong><br>
          模型名称：${this.escape(bar.dataset.model || '-')}<br>
          百分比分数：${this.escape(bar.dataset.value || '-')}
        `;
        this.el.chartTooltip.hidden = false;
        this.moveChartTooltip(event);
      }

      dashboardPoints() {
        return this.records
          .filter(record => this.dashboardModels[record.id] !== false)
          .map(record => {
            const date = this.parseChartDate(record.data?.eval_date || record.createdAt);
            if (!date) return null;
            const values = this.metricFields.reduce((output, field) => {
              output[field.key] = this.parsePercent(record.data?.[field.key]);
              return output;
            }, {});
            return {
              date,
              dateLabel: this.formatChartDate(date),
              modelName: record.data?.model_eval_name || '-',
              values
            };
          })
          .filter(Boolean)
          .sort((a, b) => a.date - b.date);
      }

      syncDashboardModelSelection() {
        const ids = new Set(this.records.map(record => record.id));
        Object.keys(this.dashboardModels).forEach(id => {
          if (!ids.has(id)) delete this.dashboardModels[id];
        });
        this.records.forEach(record => {
          if (!(record.id in this.dashboardModels)) this.dashboardModels[record.id] = true;
        });
      }

      buildTrendChart(fields, points, mode = 'compact') {
        const expanded = mode === 'expanded';
        const width = Math.max(expanded ? 1080 : 860, points.length * (expanded ? 152 : 112) + 160);
        const height = expanded ? 560 : 320;
        const padding = { top: expanded ? 36 : 24, right: 36, bottom: expanded ? 72 : 54, left: 54 };
        const plotWidth = width - padding.left - padding.right;
        const plotHeight = height - padding.top - padding.bottom;
        const x = index => padding.left + (points.length === 1 ? plotWidth / 2 : (index / (points.length - 1)) * plotWidth);
        const y = value => padding.top + (1 - value / 100) * plotHeight;
        const axisColor = '#cfd7e6';
        const gridColor = '#edf1f7';
        const fieldIndex = new Map(this.metricFields.map((field, index) => [field.key, index]));
        let svg = `<svg viewBox="0 0 ${width} ${height}" xmlns="http://www.w3.org/2000/svg">`;
        [0, 25, 50, 75, 100].forEach(tick => {
          const yy = y(tick);
          svg += `<line x1="${padding.left}" y1="${yy}" x2="${width - padding.right}" y2="${yy}" stroke="${gridColor}" />`;
          svg += `<text x="${padding.left - 10}" y="${yy + 4}" text-anchor="end" fill="#878d99" font-size="12">${tick}%</text>`;
        });
        svg += `<line x1="${padding.left}" y1="${padding.top}" x2="${padding.left}" y2="${height - padding.bottom}" stroke="${axisColor}" />`;
        svg += `<line x1="${padding.left}" y1="${height - padding.bottom}" x2="${width - padding.right}" y2="${height - padding.bottom}" stroke="${axisColor}" />`;
        points.forEach((point, index) => {
          const xx = x(index);
          svg += `<text x="${xx}" y="${height - padding.bottom + 24}" text-anchor="middle" fill="#878d99" font-size="12">${this.escape(point.dateLabel)}</text>`;
        });
        fields.forEach(field => {
          const color = this.chartColors[(fieldIndex.get(field.key) || 0) % this.chartColors.length];
          const validPoints = points
            .map((point, index) => ({ point, index, value: point.values[field.key] }))
            .filter(item => item.value !== null);
          if (!validPoints.length) return;
          const path = validPoints.map((item, pathIndex) => `${pathIndex ? 'L' : 'M'} ${x(item.index)} ${y(item.value)}`).join(' ');
          svg += `<path d="${path}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />`;
          validPoints.forEach(item => {
            svg += `<circle cx="${x(item.index)}" cy="${y(item.value)}" r="4" fill="#fff" stroke="${color}" stroke-width="2" data-chart-point="true" data-field="${this.escape(field.name)}" data-model="${this.escape(item.point.modelName)}" data-value="${item.value.toFixed(2)}%" />`;
          });
        });
        svg += `</svg>`;
        return {
          width,
          height,
          svg: svg.replace(/^<svg[^>]*>|<\/svg>$/g, '')
        };
      }

      renderTrendChart(fields, points) {
        const chart = this.buildTrendChart(fields, points, 'compact');
        this.el.trendChart.setAttribute('viewBox', `0 0 ${chart.width} ${chart.height}`);
        this.el.trendChart.style.minWidth = `${chart.width}px`;
        this.el.trendChart.innerHTML = chart.svg;
        this.bindChartTooltip(this.el.trendChart);
      }

      trendLegendHtml(fields) {
        const fieldIndex = new Map(this.metricFields.map((field, index) => [field.key, index]));
        return fields.map(field => {
          const color = this.chartColors[(fieldIndex.get(field.key) || 0) % this.chartColors.length];
          return `<span class="legend-item"><span class="legend-swatch" style="background:${color}"></span>${this.escape(field.name)}</span>`;
        }).join('');
      }

      renderTrendLegend(fields) {
        this.el.trendLegend.innerHTML = this.trendLegendHtml(fields);
      }

      bindChartTooltip(root = this.el.trendChart) {
        root.querySelectorAll('[data-chart-point]').forEach(point => {
          point.addEventListener('mouseenter', event => this.showChartTooltip(event));
          point.addEventListener('mousemove', event => this.moveChartTooltip(event));
          point.addEventListener('mouseleave', () => this.hideChartTooltip());
        });
      }

      showChartTooltip(event) {
        const point = event.target;
        this.el.chartTooltip.innerHTML = `
          <strong>${this.escape(point.dataset.field || '-')}</strong><br>
          模型名称：${this.escape(point.dataset.model || '-')}<br>
          百分比分数：${this.escape(point.dataset.value || '-')}
        `;
        this.el.chartTooltip.hidden = false;
        this.moveChartTooltip(event);
      }

      moveChartTooltip(event) {
        this.el.chartTooltip.style.left = `${event.clientX + 12}px`;
        this.el.chartTooltip.style.top = `${event.clientY + 12}px`;
      }

      hideChartTooltip() {
        this.el.chartTooltip.hidden = true;
      }

      parsePercent(value) {
        const text = String(value ?? '').trim();
        if (!text) return null;
        const number = Number(text.replace('%', ''));
        if (!Number.isFinite(number)) return null;
        return Math.max(0, Math.min(100, number));
      }

      parseChartDate(value) {
        const text = String(value ?? '').trim();
        if (!text) return null;
        const normalized = text.replace(/\//g, '-');
        const match = normalized.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
        if (match) {
          const date = new Date(Number(match[1]), Number(match[2]) - 1, Number(match[3]));
          return Number.isNaN(date.getTime()) ? null : date;
        }
        const date = new Date(normalized);
        return Number.isNaN(date.getTime()) ? null : date;
      }

      formatChartDate(date) {
        const pad = number => String(number).padStart(2, '0');
        return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}`;
      }

      handleRecordInput(event) {
        const cell = event.target.closest('[data-record-id]');
        if (!cell) return;
        const record = this.records.find(item => item.id === cell.dataset.recordId);
        if (!record) return;
        const value = this.normalizeCellText(cell.textContent);
        if (cell.dataset.meta === 'createdAt') record.createdAt = this.iterationWorkbook.parseImportedTime(value) || value;
        if (cell.dataset.field) record.data[cell.dataset.field] = value;
        cell.title = value || '-';
        this.renderReviewSummary();
        this.renderModelMenu();
        this.renderDashboard();
        this.saveState();
      }

      handleTablePaste(event) {
        const cell = event.target.closest('[data-record-id]');
        if (!cell) return;
        const text = event.clipboardData?.getData('text/plain') || '';
        if (!text.includes('\t') && !text.includes('\n')) return;
        event.preventDefault();
        const startRow = Number(cell.dataset.rowIndex);
        const startCol = Number(cell.dataset.colIndex);
        const rows = text.replace(/\r/g, '').split('\n').filter((row, index, list) => row || index < list.length - 1);
        const fields = this.allFields();
        rows.forEach((rowText, rowOffset) => {
          const recordIndex = startRow + rowOffset;
          while (recordIndex >= this.records.length) this.records.push(this.createEmptyRecord());
          const values = rowText.split('\t');
          values.forEach((value, colOffset) => {
            const colIndex = startCol + colOffset;
            const cleanValue = this.normalizeCellText(value);
            if (colIndex === -1) {
              this.records[recordIndex].createdAt = this.iterationWorkbook.parseImportedTime(cleanValue) || cleanValue || this.records[recordIndex].createdAt;
              return;
            }
            const field = fields[colIndex];
            if (field) this.records[recordIndex].data[field.key] = cleanValue;
          });
        });
        this.renderReviewTable();
        this.syncDashboardModelSelection();
        this.renderModelMenu();
        this.renderDashboard();
        this.saveState(`已粘贴 ${rows.length} 行数据`);
      }

      createEmptyRecord() {
        const data = this.allFields().reduce((record, field) => {
          record[field.key] = '';
          return record;
        }, {});
        return {
          id: `record_${Date.now()}_${Math.random().toString(36).slice(2, 8)}`,
          createdAt: new Date().toISOString(),
          sourceText: '',
          data
        };
      }

      renderReviewTable() {
        const fields = this.allFields();
        const columns = this.tableColumns();
        const colgroup = `<colgroup>${columns.map(column => `<col data-column-key="${this.escape(column.key)}" style="width:${this.getColumnWidth(column.key)}px">`).join('')}</colgroup>`;
        this.el.reviewTableHead.parentElement.querySelector('colgroup')?.remove();
        this.el.reviewTableHead.insertAdjacentHTML('beforebegin', colgroup);
        this.el.reviewTableHead.innerHTML = `<tr>${columns.map(column => `<th data-column-key="${this.escape(column.key)}" ${column.field ? `data-field="${this.escape(column.field.key)}"` : ''}>${this.escape(column.name)}<span class="resize-handle" data-column-key="${this.escape(column.key)}" title="拖拽调整列宽"></span></th>`).join('')}</tr>`;
        this.renderReviewSummary();
        if (!this.records.length) {
          this.el.reviewTableBody.innerHTML = `<tr><td colspan="${fields.length + 1}"><div class="review-empty">暂无记录，可点击“新增空记录”或导入迭代记录表。</div></td></tr>`;
          return;
        }
        this.el.reviewTableBody.innerHTML = this.records.map((record, rowIndex) => `
          <tr>
            <td contenteditable="true" spellcheck="false" data-record-id="${this.escape(record.id)}" data-row-index="${rowIndex}" data-col-index="-1" data-meta="createdAt" title="${this.escape(this.formatTime(record.createdAt))}">${this.escape(this.formatTime(record.createdAt))}</td>
            ${fields.map((field, colIndex) => `<td contenteditable="true" spellcheck="false" data-record-id="${this.escape(record.id)}" data-row-index="${rowIndex}" data-col-index="${colIndex}" data-field="${this.escape(field.key)}" class="${field.type === 'percent' ? 'percent' : ''}" title="${this.escape(record.data[field.key] || '-')}">${this.escape(record.data[field.key] || '')}</td>`).join('')}
          </tr>
        `).join('');
      }

      tableColumns() {
        return [
          { key: 'createdAt', name: '记录时间' },
          ...this.allFields().map(field => ({ key: field.key, name: field.name, field }))
        ];
      }

      getColumnWidth(key) {
        const saved = Number(this.columnWidths[key]);
        if (Number.isFinite(saved) && saved >= 80) return saved;
        if (['model_eval_name', 'model_eval_report', 'model_eval_link', 'training_data_link'].includes(key)) return 220;
        if (key === 'createdAt') return 150;
        return 130;
      }

      startColumnResize(event) {
        const handle = event.target.closest('.resize-handle');
        if (!handle) return;
        event.preventDefault();
        const key = handle.dataset.columnKey;
        const th = handle.closest('th');
        this.columnResize = {
          key,
          startX: event.clientX,
          startWidth: th.getBoundingClientRect().width
        };
        handle.classList.add('active');
        document.addEventListener('pointermove', this.boundColumnResizeMove ||= event => this.moveColumnResize(event));
        document.addEventListener('pointerup', this.boundColumnResizeEnd ||= event => this.endColumnResize(event), { once: true });
      }

      moveColumnResize(event) {
        if (!this.columnResize) return;
        const width = Math.max(80, Math.round(this.columnResize.startWidth + event.clientX - this.columnResize.startX));
        this.applyColumnWidth(this.columnResize.key, width);
      }

      endColumnResize() {
        if (!this.columnResize) return;
        document.removeEventListener('pointermove', this.boundColumnResizeMove);
        this.el.reviewTableHead.querySelector('.resize-handle.active')?.classList.remove('active');
        this.saveState();
        this.showTableStatus('列宽已保存');
        this.columnResize = null;
      }

      applyColumnWidth(key, width) {
        this.columnWidths[key] = width;
        const col = this.el.reviewTableHead.parentElement.querySelector(`col[data-column-key="${CSS.escape(key)}"]`);
        if (col) col.style.width = `${width}px`;
      }

      renderReviewSummary() {
        const latestRecord = this.records[0];
        const latest = latestRecord?.data || {};
        const summaryField = this.metricFieldByName('最终得分') || this.metricFields[0];
        const summaryValue = summaryField ? latest[summaryField.key] || '-' : '-';
        this.el.reviewSummary.innerHTML = `
          <div class="review-stat"><strong>${this.records.length}</strong><span>迭代记录</span></div>
          <div class="review-stat"><strong>${this.escape(summaryValue)}</strong><span>最新${this.escape(summaryField?.name || '得分')}</span></div>
          <div class="review-stat"><strong>${this.escape(latest.model_eval_name || '-')}</strong><span>最新模型评估名称</span></div>
        `;
      }

      formatTime(value) {
        if (!value) return '-';
        const date = new Date(value);
        if (Number.isNaN(date.getTime())) return value;
        const pad = number => String(number).padStart(2, '0');
        return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())} ${pad(date.getHours())}:${pad(date.getMinutes())}`;
      }


      resetAll() {
        StorageService.clear();
        this.detection = null;
        this.workbook = null;
        this.manualValues = {};
        this.metricFields = [];
        this.dashboardFields = this.normalizeDashboardFields({});
        this.dashboardModels = {};
        this.records = [];
        this.renderReviewTable();
        this.renderManualFields();
        this.renderDimensionMenu();
        this.renderModelMenu();
        this.renderDashboard();
        this.recalculate();
        this.el.fileInput.value = '';
        this.el.fileName.textContent = '未选择文件';
        this.saveState();
        this.showStatus('success', '已重置基础信息、自动识别结果和迭代记录表');
        this.showTableStatus('已重置迭代记录表');
      }

      saveState(message = '') {
        const state = this.currentState();
        this.localChangeSequence += 1;
        StorageService.save(state);
        this.scheduleCloudSave(state);
        if (message) this.showStatus('success', message);
      }

      currentState() {
        return {
          metricFields: this.metricFields,
          manualValues: this.manualValues,
          columnWidths: this.columnWidths,
          dashboardFields: this.dashboardFields,
          dashboardModels: this.dashboardModels,
          review: {
            records: this.records
          }
        };
      }

      applyState(state) {
        const normalized = StorageService.normalize(state);
        this.detection = null;
        this.manualValues = normalized.manualValues || {};
        this.columnWidths = normalized.columnWidths || {};
        this.records = (normalized.review?.records || []).slice().sort((a, b) => (b.createdAt || '').localeCompare(a.createdAt || ''));
        this.migrateLegacyRecords(this.records);
        this.metricFields = this.resolveMetricFields(normalized.metricFields || [], this.records);
        this.dashboardFields = this.normalizeDashboardFields(normalized.dashboardFields || {});
        this.dashboardModels = normalized.dashboardModels || {};
        this.renderManualFields();
        this.renderReviewTable();
        this.renderDimensionMenu();
        this.renderModelMenu();
        this.renderDashboard();
      }

      async loadCloudState() {
        if (!CloudStorageService.isAvailable()) return;
        try {
          const snapshot = await CloudStorageService.load();
          if (!snapshot) {
            this.showTableStatus('云端初始化中...');
            this.saveState();
            return;
          }
          this.cloudVersion = snapshot.version;
          const state = snapshot.state;
          if (!state || !Object.keys(state).length) {
            this.showTableStatus('正在将本地数据迁移到云端...');
            this.saveState();
            return;
          }
          this.applyState(state);
          StorageService.save(state);
          this.lastCloudSavedSequence = this.localChangeSequence;
          this.showTableStatus('云端已同步');
        } catch (error) {
          this.showTableStatus('云端不可用，本地保存', true);
        }
      }

      scheduleCloudSave(state) {
        if (!CloudStorageService.isAvailable()) return;
        clearTimeout(this.cloudSaveTimer);
        if (this.cloudBlockedByConflict) {
          this.showTableStatus('检测到协作冲突，请刷新页面后继续编辑', true);
          return;
        }
        const sequence = this.localChangeSequence;
        this.showTableStatus('正在同步云端...');
        this.cloudSaveTimer = setTimeout(async () => {
          if (this.cloudSaveInFlight) {
            this.scheduleCloudSave(this.currentState());
            return;
          }
          this.cloudSaveInFlight = true;
          try {
            const snapshot = await CloudStorageService.save(state, this.cloudVersion);
            this.cloudVersion = snapshot.version;
            this.lastCloudSavedSequence = Math.max(this.lastCloudSavedSequence, sequence);
            if (sequence < this.localChangeSequence) {
              this.scheduleCloudSave(this.currentState());
            } else {
              this.showTableStatus(`云端已同步 · 版本 ${this.cloudVersion}`);
            }
          } catch (error) {
            if (error.isConflict) {
              this.cloudBlockedByConflict = true;
              this.showTableStatus('其他人已更新云端；当前修改未覆盖对方数据，请刷新后重试', true);
            } else {
              this.showTableStatus('云端同步失败，本地已保存', true);
            }
          } finally {
            this.cloudSaveInFlight = false;
          }
        }, 1200);
      }

      startCloudPolling() {
        if (!CloudStorageService.isAvailable() || this.cloudPollTimer) return;
        this.cloudPollTimer = window.setInterval(() => this.refreshCloudState(), 10000);
        document.addEventListener('visibilitychange', () => {
          if (!document.hidden) this.refreshCloudState();
        });
      }

      async refreshCloudState() {
        const hasPendingChanges = this.lastCloudSavedSequence < this.localChangeSequence;
        if (document.hidden || hasPendingChanges || this.cloudSaveInFlight || this.cloudBlockedByConflict) return;
        try {
          const snapshot = await CloudStorageService.load();
          if (!snapshot || snapshot.version <= this.cloudVersion) return;
          this.cloudVersion = snapshot.version;
          this.applyState(snapshot.state);
          StorageService.save(snapshot.state);
          this.showTableStatus(`已同步其他人的更新 · 版本 ${this.cloudVersion}`);
        } catch (error) {
          this.showTableStatus('云端刷新失败，本地数据不受影响', true);
        }
      }

      showStatus(type, message) {
        this.el.status.className = `status ${type} show`;
        this.el.status.textContent = message;
      }

      showTableStatus(message, isError = false) {
        this.el.tableStatus.textContent = message;
        this.el.tableStatus.style.color = isError ? '#b42318' : '';
      }

      normalizeCellText(value) {
        return String(value ?? '').replace(/[\r\n\t]+/g, ' ').trim();
      }

      escape(value) {
        return String(value ?? '').replace(/[&<>'"]/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[char]));
      }
    }

    document.addEventListener('DOMContentLoaded', () => new UIController());
  </script>
</body>
